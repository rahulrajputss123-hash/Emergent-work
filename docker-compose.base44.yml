services:
  web:
    image: oven/bun:1.2
    working_dir: /app
    # Bind-mount the cloned source so edits hot-reload without rebuilding.
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:8080"
    env_file:
      - .env                       # committed publishable keys + Supabase URL (not secrets)
      - /run/base44/app.env        # platform-managed secrets (service role key, etc.) — LAST, wins
    command: sh -c "bun install && bun run dev --host 0.0.0.0"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8080/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
