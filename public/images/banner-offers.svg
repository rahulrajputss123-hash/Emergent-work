<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Offers banner — faint gift and rewards decoration">
  <defs>
    <linearGradient id="gBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E6149"/>
      <stop offset="1" stop-color="#173B2C"/>
    </linearGradient>
    <linearGradient id="gLid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#356B52"/>
      <stop offset="1" stop-color="#1E4636"/>
    </linearGradient>
    <linearGradient id="gRibbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8B84B"/>
      <stop offset="1" stop-color="#C9921F"/>
    </linearGradient>
  </defs>

  <!-- transparent background: lets the banner's gold gradient show through -->

  <!-- faint dotted flourish, far right -->
  <g fill="none" stroke="#173B2C" stroke-width="2.5" opacity="0.28" stroke-dasharray="1 12" stroke-linecap="round">
    <path d="M1010 150 A 110 110 0 0 1 1150 280"/>
  </g>

  <!-- small gift box, right side, vertically centered -->
  <g opacity="0.92">
    <ellipse cx="975" cy="372" rx="92" ry="13" fill="#173B2C" opacity="0.22"/>
    <!-- lid -->
    <rect x="895" y="248" width="160" height="34" rx="9" fill="url(#gLid)"/>
    <!-- body -->
    <rect x="903" y="282" width="144" height="92" rx="8" fill="url(#gBox)"/>
    <!-- vertical ribbon -->
    <rect x="963" y="248" width="26" height="126" fill="url(#gRibbon)"/>
    <!-- horizontal ribbon on lid -->
    <rect x="895" y="258" width="160" height="13" fill="url(#gRibbon)"/>
    <!-- bow -->
    <path d="M976 248 C958 230 940 240 948 258 C952 266 970 260 976 254 Z" fill="url(#gRibbon)"/>
    <path d="M976 248 C994 230 1012 240 1004 258 C1000 266 982 260 976 254 Z" fill="url(#gRibbon)"/>
    <ellipse cx="976" cy="253" rx="11" ry="8" fill="#173B2C"/>
  </g>

  <!-- subtle sparkles -->
  <g fill="#173B2C" opacity="0.5">
    <path d="M848 196 l2 7 7 2 -7 2 -2 7 -2 -7 -7 -2 7 -2 z"/>
    <path d="M1110 360 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2 z"/>
  </g>
  <g fill="#E8B84B" opacity="0.55">
    <circle cx="832" cy="322" r="5"/>
    <path d="M1132 210 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2 z"/>
  </g>
</svg>
